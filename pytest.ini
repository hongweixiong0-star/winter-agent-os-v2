[pytest]
# This host refuses bulk deletions.
#
# A sandbox shim aborts `shutil.rmtree` once a directory holds roughly 50 files,
# raising SystemExit.  pytest calls rmtree for two different things, and the
# history here is worth keeping because the first attempt at this file made the
# problem worse rather than better:
#
#   1. per-test `tmp_path` teardown, and
#   2. the session-level wipe of whatever `--basetemp` points at, plus the
#      garbage-collection of old numbered roots.
#
# The first attempt set `tmp_path_retention_policy = none` (stop deleting test
# dirs) AND `addopts = --basetemp=tools/_pt_bt`.  Those two fight each other: the
# retention policy leaves every test directory in the basetemp, so the basetemp
# grows to ~145 files, and then the *next* run's start-up wipe tries to delete
# exactly that directory and hits the guard.  Measured 2026-09-15: 595 passed,
# 0 failures, 27 errors, first error `SystemExit: 1`, and the remaining errors
# cascade into whatever runs next -- always at fixture setup.
#
# So: no retention override and no --basetemp.  Default behaviour deletes each
# test's directory while it is still small, which is under the threshold.  That
# only holds if a test does not fill one directory with many files, so
# `tests/test_wiring_static_resolution.py` copies the package ONCE per module
# rather than once per test -- it was the 145-file offender.
#
# Told apart from a real regression in one step: run the suspect file on its own.
# If it passes in isolation, the errors are this, not the code.
#
# If the guard does fire again, the accumulated leftovers are under
# %TEMP%\pytest-of-xhw (and any project-local `tools/_pt_*` sandbox): they are
# pytest scratch, safe to delete, and clearing them once is what stops the
# failure from feeding itself.
