[pytest]
# This host refuses bulk deletions.
#
# The sandbox aborts any `shutil.rmtree` over roughly 50 files with
# `SystemExit`, and pytest calls `rmtree` when it cleans up a test's `tmp_path`.
# The aborted teardown then corrupts fixture state, so the suite reports ~26
# errors in files that have nothing to do with the offender -- every one of them
# at fixture *setup*, which is the giveaway.
#
# Measured 2026-09-15 (`pytest tests -q`): 26 errors, and the same files run in
# isolation gave 12 passed / 0 error.  The traceback goes into the host shim
# (sitecustomize.py -> _check_bulk_delete_guard -> SystemExit), not project code,
# so this has twice been mistaken for a regression.  For the record, the way to
# tell them apart in one step is to run the suspect file on its own.
#
# Keeping tmp_path directories removes the deletion altogether.  They accumulate
# under a git-ignored, project-local basetemp, which is a fair trade for a result
# file that can be read at a glance.  Override with `--basetemp=<dir>` when a
# clean sandbox is wanted.
tmp_path_retention_policy = none
tmp_path_retention_count = 0
addopts = --basetemp=tools/_pt_bt
